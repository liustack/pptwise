<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>章节：明年</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#15191E}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; color: #15191E; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">
  <img src="/_blob/86d772c27da54ae8d60fdf112ebedfea" alt="仓库货架" style="position: absolute; left: 700px; top: 0; width: 580px; height: 720px; object-fit: cover; object-position: 50% 50%">

  <div style="position: absolute; left: 80px; top: 72px; width: 560px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 120px; line-height: 0.9; font-weight: 700; color: {{accent}}">03</span>
    <span style="font-size: 44px; line-height: 1.3; font-weight: 900; margin-top: 18px">2027 年：5 亿元怎么拿</span>
    <span style="font-size: 18px; color: #5B6470">目标、打法和我需要的支持</span>
  </div>

  <div style="position: absolute; left: 80px; top: 420px; width: 560px; display: flex; flex-direction: column; border-top: 2px solid #15191E">
    <div style="display: grid; grid-template-columns: 34px 80px minmax(0, 1fr); align-items: center; height: 62px; border-bottom: 1px solid #D9DDE2">
      <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 18px; font-weight: 700; color: #5B6470">1</span>
      <span style="font-size: 17px; font-weight: 700">目标</span>
      <span style="font-size: 16px">5.0 亿元，增量 5,900 万元</span>
    </div>
    <div style="display: grid; grid-template-columns: 34px 80px minmax(0, 1fr); align-items: center; height: 62px; border-bottom: 1px solid #D9DDE2">
      <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 18px; font-weight: 700; color: #5B6470">2</span>
      <span style="font-size: 17px; font-weight: 700">打法</span>
      <span style="font-size: 16px">先稳苏北，下半年卖场和营业厅一起扩</span>
    </div>
    <div style="display: grid; grid-template-columns: 34px 80px minmax(0, 1fr); align-items: center; height: 62px; border-bottom: 1px solid #D9DDE2">
      <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 18px; font-weight: 700; color: #5B6470">3</span>
      <span style="font-size: 17px; font-weight: 700">支持</span>
      <span style="display: flex; align-items: center; justify-content: space-between; font-size: 16px">人、钱、政策三项<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: {{deep}}"><span style="display: block; width: 12px; height: 12px; box-sizing: border-box; border: 1.5px solid {{deep}}"></span>待批</span></span>
    </div>
  </div>

  <div style="position: absolute; left: 80px; width: 560px; bottom: 28px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #5B6470">
    <span>示例人物，姓名和数据均为虚构</span>
    <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 14px; font-weight: 600; color: #15191E">12</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E69","options":["#0B6E69","#1D4ED8","#C8102E","#15803D"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  shade(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * t));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B6E69';
    return { accent, deep: this.shade(accent, 0.75) };
  }
}
</script>
</body>
</html>
