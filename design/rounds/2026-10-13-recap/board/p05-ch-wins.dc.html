</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E69","options":["#0B6E69","#1D4ED8","#C8102E","#15803D"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  shade(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * t));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B6E69';
    return { accent, deep: this.shade(accent, 0.75) };
  }
}
</script>
