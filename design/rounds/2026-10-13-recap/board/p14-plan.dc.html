<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>季度打法</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#15191E}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; color: #15191E; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">
  <div style="position: absolute; left: 80px; top: 56px; display: flex; align-items: baseline; gap: 10px; font-size: 14px; font-weight: 500; letter-spacing: 0.14em; color: #5B6470">
    <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0; color: {{deep}}">03</span>明年
  </div>
  <div style="position: absolute; left: 80px; top: 84px; width: 1120px; font-size: 32px; line-height: 1.4; font-weight: 900">上半年先把苏北稳住，下半年卖场和营业厅一起扩</div>

  <div style="position: absolute; left: 80px; top: 176px; width: 1120px; height: 440px">
    <div style="position: absolute; left: 200px; top: 0; width: 920px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: 14px; font-weight: 700; padding-bottom: 8px; border-bottom: 2px solid #15191E">
      <span style="padding-left: 10px">一季度</span><span style="padding-left: 10px">二季度</span><span style="padding-left: 10px">三季度</span><span style="padding-left: 10px">四季度</span>
    </div>
    <div style="position: absolute; left: 430px; top: 30px; width: 0; height: 410px; border-left: 1px solid #D9DDE2"></div>
    <div style="position: absolute; left: 660px; top: 30px; width: 0; height: 410px; border-left: 1px solid #D9DDE2"></div>
    <div style="position: absolute; left: 890px; top: 30px; width: 0; height: 410px; border-left: 1px solid #D9DDE2"></div>

    <div style="position: absolute; left: 0; top: 48px; width: 190px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 700">苏北稳住</span>
      <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: {{deep}}"><span style="display: block; width: 9px; height: 9px; background: {{accent}}"></span>先做</span>
    </div>
    <div style="position: absolute; left: 204px; top: 46px; width: 222px; height: 48px; box-sizing: border-box; padding: 0 12px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 500">两家分销跑满一个季度</div>

    <div style="position: absolute; left: 0; top: 116px; width: 190px; font-size: 16px; font-weight: 700; line-height: 48px">卖场到 160 家</div>
    <div style="position: absolute; left: 434px; top: 116px; width: 222px; height: 48px; box-sizing: border-box; padding: 0 12px; background: #E7E9EC; display: flex; align-items: center; font-size: 14px">新增 40 家店</div>

    <div style="position: absolute; left: 0; top: 186px; width: 190px; font-size: 16px; font-weight: 700; line-height: 48px">两条线一起扩</div>
    <div style="position: absolute; left: 664px; top: 186px; width: 222px; height: 48px; box-sizing: border-box; padding: 0 12px; background: #E7E9EC; display: flex; align-items: center; font-size: 14px">卖场 200 家，营业厅 350 个</div>

    <div style="position: absolute; left: 0; top: 256px; width: 190px; font-size: 16px; font-weight: 700; line-height: 48px">冲刺</div>
    <div style="position: absolute; left: 894px; top: 256px; width: 222px; height: 48px; box-sizing: border-box; padding: 0 12px; background: #E7E9EC; display: flex; align-items: center; font-size: 14px">旺季加以旧换新</div>

    <div style="position: absolute; left: 0; top: 330px; width: 1120px; border-top: 1px solid #15191E"></div>
    <div style="position: absolute; left: 0; top: 344px; width: 190px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; font-weight: 700">季度目标</span>
      <span style="font-size: 12px; color: #5B6470">万元，全年 50,000</span>
    </div>
    <div style="position: absolute; left: 200px; top: 340px; width: 920px; height: 100px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: end">
      <span style="display: flex; align-items: flex-end; gap: 10px; padding-left: 10px"><span style="display: block; width: 28px; height: 59px; background: #2E353D"></span><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 24px; font-weight: 600; line-height: 1">11,000</span></span>
      <span style="display: flex; align-items: flex-end; gap: 10px; padding-left: 10px"><span style="display: block; width: 28px; height: 65px; background: #2E353D"></span><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 24px; font-weight: 600; line-height: 1">12,000</span></span>
      <span style="display: flex; align-items: flex-end; gap: 10px; padding-left: 10px"><span style="display: block; width: 28px; height: 66px; background: #2E353D"></span><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 24px; font-weight: 600; line-height: 1">12,200</span></span>
      <span style="display: flex; align-items: flex-end; gap: 10px; padding-left: 10px"><span style="display: block; width: 28px; height: 80px; background: #2E353D"></span><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 24px; font-weight: 600; line-height: 1">14,800</span></span>
    </div>
  </div>

  <div style="position: absolute; left: 80px; right: 80px; bottom: 28px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #5B6470">
    <span>示例人物，姓名和数据均为虚构</span>
    <span>周启航 · 2026 年度述职　<span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 14px; font-weight: 600; color: #15191E">14</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E69","options":["#0B6E69","#1D4ED8","#C8102E","#15803D"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  shade(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * t));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B6E69';
    return { accent, deep: this.shade(accent, 0.75) };
  }
}
</script>
</body>
</html>
