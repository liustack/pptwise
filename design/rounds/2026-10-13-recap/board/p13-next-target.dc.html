body{margin:0}

  </div>
  <div style="position: absolute; left: 80px; top: 84px; width: 1120px; font-size: 32px; line-height: 1.4; font-weight: 900">明年目标 5.0 亿元，增量 5,900 万元有 83% 落在三条线上</div>

  <div style="position: absolute; left: 80px; top: 172px; width: 600px; display: flex; justify-content: space-between; font-size: 13px; color: #5B6470">
    <span>单位：万元</span>
    <span style="display: flex; gap: 18px">
      <span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 12px; height: 12px; background: #9AA3AE"></span>2026 年实际</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 12px; height: 12px; box-sizing: border-box; border: 1.5px dashed {{accent}}; background: {{tint}}"></span>2027 年目标</span>
    </span>
  </div>

  <div style="position: absolute; left: 80px; top: 200px; width: 600px; height: 330px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; border-bottom: 1.5px solid #15191E">
    <div style="display: flex; justify-content: center; align-items: flex-end; gap: 10px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 15px; font-weight: 600">3,100</span><div style="width: 56px; height: 155px; background: #9AA3AE"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 13px; font-weight: 700; color: {{deep}}">+2,600</span><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 15px; font-weight: 600">5,700</span><div style="width: 56px; height: 285px; box-sizing: border-box; border: 1.5px dashed {{accent}}; background: {{tint}}"></div></div>
    </div>
    <div style="display: flex; justify-content: center; align-items: flex-end; gap: 10px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 15px; font-weight: 600">1,850</span><div style="width: 56px; height: 93px; background: #9AA3AE"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 13px; font-weight: 700; color: {{deep}}">+1,700</span><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 15px; font-weight: 600">3,550</span><div style="width: 56px; height: 178px; box-sizing: border-box; border: 1.5px dashed {{accent}}; background: {{tint}}"></div></div>
    </div>
    <div style="display: flex; justify-content: center; align-items: flex-end; gap: 10px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 15px; font-weight: 600">3,900</span><div style="width: 56px; height: 195px; background: #9AA3AE"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 13px; font-weight: 700; color: {{deep}}">+600</span><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 15px; font-weight: 600">4,500</span><div style="width: 56px; height: 225px; box-sizing: border-box; border: 1.5px dashed {{accent}}; background: {{tint}}"></div></div>
    </div>
  </div>
  <div style="position: absolute; left: 80px; top: 538px; width: 600px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; font-size: 15px">
    <span>连锁卖场</span><span>运营商</span><span>苏北</span>
  </div>

  <div style="position: absolute; left: 760px; top: 186px; width: 440px; display: flex; flex-direction: column; border-top: 2px solid #15191E">
    <div style="padding: 22px 0; border-bottom: 1px solid #D9DDE2; display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 72px; line-height: 1; font-weight: 700; color: {{accent}}">5.0<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 20px; font-weight: 700; margin-left: 6px">亿元</span></span>
      <span style="font-size: 16px; font-weight: 500">2027 年全年目标</span>
      <span style="font-size: 14px; color: #5B6470">同比 +13.4%，增量 5,900 万元</span>
    </div>
    <div style="padding: 22px 0; border-bottom: 1px solid #D9DDE2; display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 48px; line-height: 1; font-weight: 600">4,900<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 16px; font-weight: 500; margin-left: 6px">万元</span></span>
      <span style="font-size: 16px; font-weight: 500">三条线合计增量</span>
      <span style="font-size: 14px; color: #5B6470">老渠道再贡献 1,000 万元</span>
    </div>

  <div style="position: absolute; left: 80px; top: 640px; font-size: 13px; color: #5B6470">口径：华东区渠道出货额（含税），单位万元</div>
  <div style="position: absolute; left: 80px; right: 80px; bottom: 28px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #5B6470">
    <span>示例人物，姓名和数据均为虚构</span>
    <span>周启航 · 2026 年度述职　<span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 14px; font-weight: 600; color: #15191E">13</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E69","options":["#0B6E69","#1D4ED8","#C8102E","#15803D"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  shade(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * t));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  tintOf(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * t + 255 * (1 - t)));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B6E69';
    return { accent, deep: this.shade(accent, 0.75), tint: this.tintOf(accent, 0.12) };
  }
}
</script>
</body>
</html>
