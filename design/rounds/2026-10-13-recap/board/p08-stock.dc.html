<html lang="zh-CN">
<head>
<meta charset="utf-8">

<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#15191E}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; color: #15191E; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">
  <div style="position: absolute; left: 80px; top: 56px; display: flex; align-items: baseline; gap: 10px; font-size: 14px; font-weight: 500; letter-spacing: 0.14em; color: #5B6470">
    <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0; color: {{deep}}">02</span>今年做的事
  </div>
  <div style="position: absolute; left: 80px; top: 84px; width: 1120px; font-size: 32px; line-height: 1.4; font-weight: 900">我搭的周度补货看板，把渠道库存从 52 天压到 34 天</div>

  <div style="position: absolute; left: 80px; top: 176px; width: 580px; display: flex; flex-direction: column; gap: 6px">
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: {{deep}}"><span style="display: block; width: 10px; height: 10px; background: {{accent}}"></span>我牵头</span>
    <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 168px; line-height: 1; font-weight: 700; color: {{accent}}">34<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 28px; font-weight: 700; margin-left: 10px">天</span></span>
    <span style="font-size: 16px">2026 年渠道库存周转天数</span>
  </div>

  <div style="position: absolute; left: 80px; top: 470px; width: 580px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; column-gap: 12px">
      <span style="font-size: 14px; color: #5B6470">2025 年</span>
      <span style="display: flex; align-items: center; gap: 10px"><span style="display: block; width: 416px; height: 24px; background: #9AA3AE"></span><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 20px; font-weight: 600">52 天</span></span>
    </div>
    <div style="display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; column-gap: 12px">
      <span style="font-size: 14px; color: #5B6470">2026 年</span>
      <span style="display: flex; align-items: center; gap: 10px"><span style="display: block; width: 272px; height: 24px; background: {{accent}}"></span><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 20px; font-weight: 600">34 天</span><span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 20px; font-weight: 700; color: {{deep}}">−18 天</span></span>
    </div>
  </div>

  <div style="position: absolute; left: 740px; top: 186px; width: 460px; display: flex; flex-direction: column; border-top: 2px solid #15191E">
    <div style="padding: 26px 0; border-bottom: 1px solid #D9DDE2; display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 60px; line-height: 1; font-weight: 600">27 → 6<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 18px; font-weight: 500; margin-left: 6px">起</span></span>
      <span style="font-size: 16px">窜货投诉</span>
    </div>
    <div style="padding: 26px 0; border-bottom: 1px solid #D9DDE2; display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 60px; line-height: 1; font-weight: 600">380<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 18px; font-weight: 500; margin-left: 6px">家</span></span>
      <span style="font-size: 16px">周度补货看板覆盖门店</span>
    </div>
  </div>

  <div style="position: absolute; left: 80px; top: 640px; font-size: 13px; color: #5B6470">口径：看板门店渠道库存 ÷ 日均出货，按月平均</div>
  <div style="position: absolute; left: 80px; right: 80px; bottom: 28px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #5B6470">
    <span>示例人物，姓名和数据均为虚构</span>
    <span>周启航 · 2026 年度述职　<span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 14px; font-weight: 600; color: #15191E">08</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E69","options":["#0B6E69","#1D4ED8","#C8102E","#15803D"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  shade(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * t));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B6E69';
    return { accent, deep: this.shade(accent, 0.75) };
  }
}
</script>
</body>
</html>
