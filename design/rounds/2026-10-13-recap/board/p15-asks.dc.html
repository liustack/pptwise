<head>

<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#15191E}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; color: #15191E; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">
  <div style="position: absolute; left: 80px; top: 56px; display: flex; align-items: baseline; gap: 10px; font-size: 14px; font-weight: 500; letter-spacing: 0.14em; color: #5B6470">
    <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0; color: {{deep}}">03</span>明年
  </div>
  <div style="position: absolute; left: 80px; top: 84px; width: 1120px; font-size: 32px; line-height: 1.4; font-weight: 900">我需要三项支持，每一项都对得上明年的一块增量</div>

  <div style="position: absolute; left: 80px; top: 176px; width: 1120px; display: flex; flex-direction: column; font-size: 16px">
    <div style="display: grid; grid-template-columns: 110px 290px 170px minmax(0, 1fr) 150px; column-gap: 20px; padding-bottom: 8px; border-bottom: 2px solid #15191E; font-size: 13px; letter-spacing: 0.08em; color: #5B6470">
      <span>支持</span><span>具体要什么</span><span style="text-align: right">成本</span><span>换来什么</span><span>评审意见</span>
    </div>

    <div style="display: grid; grid-template-columns: 110px 290px 170px minmax(0, 1fr) 150px; column-gap: 20px; align-items: center; height: 80px; border-bottom: 1px solid #D9DDE2">
      <span style="display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 900"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15191E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg>人</span>
      <span>2 个编制：运营商 1、苏北驻点 1</span>
      <span style="text-align: right; font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 22px; font-weight: 600">36 万元/年</span>
      <span>运营商 +1,700、苏北 +600 万元</span>
      <span style="display: flex; gap: 16px; font-size: 14px"><span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 16px; height: 16px; box-sizing: border-box; border: 1.5px solid #15191E"></span>批</span><span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 16px; height: 16px; box-sizing: border-box; border: 1.5px solid #15191E"></span>不批</span></span>
    </div>

    <div style="display: grid; grid-template-columns: 110px 290px 170px minmax(0, 1fr) 150px; column-gap: 20px; align-items: center; height: 80px; border-bottom: 1px solid #D9DDE2; background: {{tint}}; margin: 0 -14px; padding: 0 14px">
      <span style="display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 900; color: {{deep}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{deep}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>钱</span>
      <span>卖场费用 620 → 880 万元</span>
      <span style="text-align: right; font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 22px; font-weight: 700; color: {{deep}}">+260 万元</span>
      <span style="font-weight: 700">卖场 +2,600 万元，费比 10%</span>
      <span style="display: flex; gap: 16px; font-size: 14px"><span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 16px; height: 16px; box-sizing: border-box; border: 1.5px solid #15191E; background: #FFFFFF"></span>批</span><span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 16px; height: 16px; box-sizing: border-box; border: 1.5px solid #15191E; background: #FFFFFF"></span>不批</span></span>
    </div>

    <div style="display: grid; grid-template-columns: 110px 290px 170px minmax(0, 1fr) 150px; column-gap: 20px; align-items: center; height: 80px; border-bottom: 1px solid #D9DDE2">
      <span style="display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 900"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15191E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"></path><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h5"></path><path d="M17.5 17.5 16 16.3V14"></path><circle cx="16" cy="16" r="6"></circle></svg>政策</span>
      <span>苏北分销账期 30 → 45 天</span>
      <span style="text-align: right; font-size: 15px">多占资金约 <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 22px; font-weight: 600">185</span> 万元</span>
      <span>分销敢备货，保住苏北 +600 万元</span>
      <span style="display: flex; gap: 16px; font-size: 14px"><span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 16px; height: 16px; box-sizing: border-box; border: 1.5px solid #15191E"></span>批</span><span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 16px; height: 16px; box-sizing: border-box; border: 1.5px solid #15191E"></span>不批</span></span>
    </div>
  </div>

  <div style="position: absolute; left: 80px; top: 520px; width: 1120px; padding-top: 18px; border-top: 2px solid #15191E; display: flex; align-items: center; gap: 14px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#15191E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="M7 21h10"></path><path d="M12 3v18"></path><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path></svg>
    <span style="font-size: 18px">人和钱合计每年 <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 34px; font-weight: 700">296</span> 万元，对应明年 <span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 34px; font-weight: 700; color: {{accent}}">4,900</span> 万元增量</span>
  </div>

  <div style="position: absolute; left: 80px; right: 80px; bottom: 28px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #5B6470">
    <span>示例人物，姓名和数据均为虚构</span>
    <span>周启航 · 2026 年度述职　<span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 14px; font-weight: 600; color: #15191E">15</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E69","options":["#0B6E69","#1D4ED8","#C8102E","#15803D"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  shade(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * t));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  tintOf(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * t + 255 * (1 - t)));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B6E69';
    return { accent, deep: this.shade(accent, 0.75), tint: this.tintOf(accent, 0.1) };
  }
}
</script>
</body>
</html>
