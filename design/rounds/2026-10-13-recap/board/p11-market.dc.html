      <span style="text-align: right; font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 20px">1,280 元</span>

  <div style="position: absolute; left: 80px; top: 540px; width: 1120px; display: flex; align-items: flex-start; gap: 14px">

  </div>

  <div style="position: absolute; left: 80px; top: 640px; font-size: 13px; color: #5B6470">口径：周度补货看板覆盖的 380 家门店，全年店均</div>
  <div style="position: absolute; left: 80px; right: 80px; bottom: 28px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #5B6470">

    <span>周启航 · 2026 年度述职　<span style="font-family: 'Barlow Semi Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif; font-size: 14px; font-weight: 600; color: #15191E">11</span></span>
  </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E69","options":["#0B6E69","#1D4ED8","#C8102E","#15803D"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  shade(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * t));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  tintOf(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * t + 255 * (1 - t)));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B6E69';
    return { accent, deep: this.shade(accent, 0.75), tint: this.tintOf(accent, 0.1) };
  }
}
</script>
