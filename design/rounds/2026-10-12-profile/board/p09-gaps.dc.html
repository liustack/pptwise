<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>短板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#6B2D55}a:hover{color:#1D1B1A}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; color: #1D1B1A; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">
  <div style="position: absolute; left: 80px; top: 64px; width: 1120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: {{accent}}">
      <span style="display: block; width: 28px; height: 2px; background: {{accent}}"></span>
      <span>三　差距</span>
    </div>
    <div style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 34px; line-height: 1.4; font-weight: 700">两样短板，上任前就开始补，90 天内交出证据</div>
  </div>

  <div style="position: absolute; left: 80px; top: 196px; width: 1120px; display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: 340px minmax(0, 1fr) 280px; column-gap: 30px; padding-bottom: 10px; border-bottom: 2px solid #1D1B1A; font-size: 13px; letter-spacing: 0.12em; color: #6B655E">
      <span>短板</span><span>怎么补</span><span>什么时候交什么</span>
    </div>

    <div style="display: grid; grid-template-columns: 340px minmax(0, 1fr) 280px; column-gap: 30px; align-items: center; padding: 26px 0; border-bottom: 1px solid #DCD6CE">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 22px; font-weight: 700">产品规划</span>
        <span style="font-size: 15px; color: #4A4540">没做过半年以上的路线图</span>
      </div>
      <span style="font-size: 17px; line-height: 1.7">请产品中心总监做导师，每两周复盘一次我排的优先级</span>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 40px; line-height: 1.1; font-weight: 900; color: {{accent}}">第 90 天</span>
        <span style="font-size: 15px">交下半年路线图初稿</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 340px minmax(0, 1fr) 280px; column-gap: 30px; align-items: center; padding: 26px 0; border-bottom: 1px solid #DCD6CE">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 22px; font-weight: 700">需求与研发协作</span>
        <span style="font-size: 15px; color: #4A4540">没跟过完整迭代</span>
      </div>
      <span style="font-size: 17px; line-height: 1.7">上任前先跟 IT 产品组从评审到上线跑完一个迭代</span>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 40px; line-height: 1.1; font-weight: 900">第 60 天</span>
        <span style="font-size: 15px">交第一份完整需求文档</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 80px; top: 532px; width: 1120px; box-sizing: border-box; padding: 24px 28px; background: #F5F2EE; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 16px; align-items: start">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1D1B1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 20px; font-weight: 700">怎么检验：第 90 天请评委重新打分</span>
      <span style="font-size: 15px; line-height: 1.6; color: #4A4540">按今天这张能力表复评，两样短板都要到岗位要求。复评结果写进转正评估。</span>
    </div>
  </div>

  <div style="position: absolute; left: 80px; right: 80px; bottom: 32px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #6B655E">
    <span>示例人物，姓名和数据均为虚构</span>
    <span>陈立行　<span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 14px; color: #1D1B1A">09</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6B2D55","options":["#6B2D55","#1F5FD1","#D0312D","#1E8A4C"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6B2D55' };
  }
}
</script>
</body>
</html>
