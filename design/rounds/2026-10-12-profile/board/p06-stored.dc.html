<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>储值卡</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#6B2D55}a:hover{color:#1D1B1A}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; color: #1D1B1A; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">
  <img src="/_blob/77dc2adf13a832ed26bc5f35568d6437" alt="四个部门围坐对稿" style="position: absolute; left: 680px; top: 0; width: 600px; height: 720px; object-fit: cover; object-position: 50% 50%">

  <div style="position: absolute; left: 80px; top: 64px; width: 540px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: {{accent}}">
      <span style="display: block; width: 28px; height: 2px; background: {{accent}}"></span>
      <span>二　做成过</span>
    </div>
    <div style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 34px; line-height: 1.4; font-weight: 700">储值卡七档并成三档，储值会员复购率从 31% 到 38%</div>
  </div>

  <div style="position: absolute; left: 80px; top: 270px; width: 540px; display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: 200px minmax(0, 1fr); column-gap: 20px; align-items: center; padding: 22px 0; border-top: 1px solid #1D1B1A">
      <div style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 44px; line-height: 1; font-weight: 700">7 → 3<span style="font-size: 18px; font-weight: 500; margin-left: 6px">档</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 17px; font-weight: 500">充值档位</div>
        <div style="font-size: 14px; line-height: 1.5; color: #6B655E">牵头 4 个部门，六周定稿上线</div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 200px minmax(0, 1fr); column-gap: 20px; align-items: center; padding: 22px 0; border-top: 1px solid #DCD6CE">
      <div style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 44px; line-height: 1; font-weight: 700; color: {{accent}}">38%</div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 17px; font-weight: 500">储值会员 90 天复购率</div>
        <div style="font-size: 14px; line-height: 1.5; color: #6B655E">改版前 31%，升 7 个百分点</div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 200px minmax(0, 1fr); column-gap: 20px; align-items: center; padding: 22px 0; border-top: 1px solid #DCD6CE; border-bottom: 1px solid #DCD6CE">
      <div style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 44px; line-height: 1; font-weight: 700">1.86<span style="font-size: 18px; font-weight: 500; margin-left: 6px">亿元</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 17px; font-weight: 500">2024 年新增储值</div>
        <div style="font-size: 14px; line-height: 1.5; color: #6B655E">2023 年 1.52 亿元，同比增长 22%</div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 80px; width: 540px; bottom: 32px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #6B655E">
    <span>示例人物，姓名和数据均为虚构　图为 AI 生成的示意图</span>
    <span>陈立行　<span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 14px; color: #1D1B1A">06</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6B2D55","options":["#6B2D55","#1F5FD1","#D0312D","#1E8A4C"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6B2D55' };
  }
}
</script>
</body>
</html>
