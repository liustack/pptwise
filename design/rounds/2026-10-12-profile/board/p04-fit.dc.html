<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>岗位对照</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#6B2D55}a:hover{color:#1D1B1A}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; color: #1D1B1A; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">
  <div style="position: absolute; left: 80px; top: 64px; width: 1120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: {{accent}}">
      <span style="display: block; width: 28px; height: 2px; background: {{accent}}"></span>
      <span>一　我是谁</span>
    </div>
    <div style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 34px; line-height: 1.4; font-weight: 700">岗位要的五样，我做成过三样，两样还要补</div>
  </div>

  <div style="position: absolute; left: 80px; top: 196px; width: 1120px; display: flex; flex-direction: column; font-size: 16px">
    <div style="display: grid; grid-template-columns: 230px 360px minmax(0, 1fr) 120px; column-gap: 24px; padding: 0 0 10px; border-bottom: 2px solid #1D1B1A; font-size: 13px; letter-spacing: 0.12em; color: #6B655E">
      <span>能力</span><span>岗位要求</span><span>我做过的事</span><span>判断</span>
    </div>

    <div style="display: grid; grid-template-columns: 230px 360px minmax(0, 1fr) 120px; column-gap: 24px; align-items: center; height: 76px; border-bottom: 1px solid #DCD6CE">
      <div style="display: flex; align-items: center; gap: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1B1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66"></path><path d="m18 15-2-2"></path><path d="m15 18-2-2"></path></svg><span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 19px; font-weight: 700">懂会员业务</span></div>
      <span style="color: #4A4540">会员分层、权益和规则设计</span>
      <span>主导生日券、储值卡两次规则改版</span>
      <div style="display: flex; align-items: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1B1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg><span>有</span></div>
    </div>

    <div style="display: grid; grid-template-columns: 230px 360px minmax(0, 1fr) 120px; column-gap: 24px; align-items: center; height: 76px; border-bottom: 1px solid #DCD6CE">
      <div style="display: flex; align-items: center; gap: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1B1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"></path><path d="M6.453 15h11.094"></path><path d="M8.5 2h7"></path></svg><span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 19px; font-weight: 700">数据与实验</span></div>
      <span style="color: #4A4540">自己定指标、做实验</span>
      <span>唤回券先 A/B 小测，再全量</span>
      <div style="display: flex; align-items: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1B1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg><span>有</span></div>
    </div>

    <div style="display: grid; grid-template-columns: 230px 360px minmax(0, 1fr) 120px; column-gap: 24px; align-items: center; height: 76px; border-bottom: 1px solid #DCD6CE">
      <div style="display: flex; align-items: center; gap: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1B1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 19px; font-weight: 700">跨部门推动</span></div>
      <span style="color: #4A4540">协调门店、IT、财务和市场</span>
      <span>储值卡改版牵头 4 个部门</span>
      <div style="display: flex; align-items: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1B1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg><span>有</span></div>
    </div>

    <div style="display: grid; grid-template-columns: 230px 360px minmax(0, 1fr) 120px; column-gap: 24px; align-items: center; height: 76px; border-bottom: 1px solid #DCD6CE">
      <div style="display: flex; align-items: center; gap: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1B1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg><span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 19px; font-weight: 700">需求与研发协作</span></div>
      <span style="color: #4A4540">独立写需求，跟完整个迭代</span>
      <span>写过 3 份需求，没跟过完整迭代</span>
      <div style="display: flex; align-items: center; gap: 8px; color: #6B655E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B655E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.1 2.182a10 10 0 0 1 3.8 0"></path><path d="M13.9 21.818a10 10 0 0 1-3.8 0"></path><path d="M17.609 3.721a10 10 0 0 1 2.69 2.7"></path><path d="M2.182 13.9a10 10 0 0 1 0-3.8"></path><path d="M20.279 17.609a10 10 0 0 1-2.7 2.69"></path><path d="M21.818 10.1a10 10 0 0 1 0 3.8"></path><path d="M3.721 6.391a10 10 0 0 1 2.7-2.69"></path><path d="M6.391 20.279a10 10 0 0 1-2.69-2.7"></path></svg><span>要补</span></div>
    </div>

    <div style="display: grid; grid-template-columns: 230px 360px minmax(0, 1fr) 120px; column-gap: 24px; align-items: center; height: 76px; border-bottom: 1px solid #DCD6CE; background: {{tint}}; margin: 0 -16px; padding: 0 16px">
      <div style="display: flex; align-items: center; gap: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"></path><path d="M15 5.764v15"></path><path d="M9 3.236v15"></path></svg><span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 19px; font-weight: 700">产品规划</span></div>
      <span style="color: #4A4540">定半年路线图和优先级</span>
      <span style="font-weight: 700; color: {{accent}}">没做过半年以上的路线图</span>
      <div style="display: flex; align-items: center; gap: 8px; color: {{accent}}; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.1 2.182a10 10 0 0 1 3.8 0"></path><path d="M13.9 21.818a10 10 0 0 1-3.8 0"></path><path d="M17.609 3.721a10 10 0 0 1 2.69 2.7"></path><path d="M2.182 13.9a10 10 0 0 1 0-3.8"></path><path d="M20.279 17.609a10 10 0 0 1-2.7 2.69"></path><path d="M21.818 10.1a10 10 0 0 1 0 3.8"></path><path d="M3.721 6.391a10 10 0 0 1 2.7-2.69"></path><path d="M6.391 20.279a10 10 0 0 1-2.69-2.7"></path></svg><span>要补</span></div>
    </div>
  </div>

  <div style="position: absolute; left: 80px; right: 80px; bottom: 32px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #6B655E">
    <span>示例人物，姓名和数据均为虚构</span>
    <span>陈立行　<span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 14px; color: #1D1B1A">04</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6B2D55","options":["#6B2D55","#1F5FD1","#D0312D","#1E8A4C"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  mix(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * t + 255 * (1 - t)));
    return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const accent = this.props.accent ?? '#6B2D55';
    return { accent, tint: this.mix(accent, 0.08) };
  }
}
</script>
</body>
</html>
