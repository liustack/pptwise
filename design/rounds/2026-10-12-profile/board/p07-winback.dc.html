<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>唤回</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#6B2D55}a:hover{color:#1D1B1A}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #FFFFFF; color: #1D1B1A; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">
  <div style="position: absolute; left: 80px; top: 64px; width: 1120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: {{accent}}">
      <span style="display: block; width: 28px; height: 2px; background: {{accent}}"></span>
      <span>二　做成过</span>
    </div>
    <div style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 34px; line-height: 1.4; font-weight: 700">按上次点的菜发券，沉睡会员唤回率是通用券的两倍多</div>
  </div>

  <div style="position: absolute; left: 80px; top: 200px; width: 680px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid #1D1B1A">
      <span style="font-size: 15px; font-weight: 500">各组菜品券唤回率</span>
      <span style="font-size: 13px; color: #6B655E">单位：%</span>
    </div>
    <div style="position: relative; display: flex; flex-direction: column">
      <div style="position: absolute; left: 294px; top: -6px; bottom: 0; width: 0; border-left: 1.5px dashed #1D1B1A"></div>
      <div style="display: grid; grid-template-columns: 110px 480px minmax(0, 1fr); column-gap: 20px; align-items: center; height: 58px">
        <span style="font-size: 16px">招牌菜</span>
        <div style="height: 28px; width: 448px; background: #1D1B1A"></div>
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 20px; font-weight: 700">11.2</span>
      </div>
      <div style="display: grid; grid-template-columns: 110px 480px minmax(0, 1fr); column-gap: 20px; align-items: center; height: 58px">
        <span style="font-size: 16px">套餐</span>
        <div style="height: 28px; width: 416px; background: #B9B0A6"></div>
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 20px">10.4</span>
      </div>
      <div style="display: grid; grid-template-columns: 110px 480px minmax(0, 1fr); column-gap: 20px; align-items: center; height: 58px">
        <span style="font-size: 16px">早餐</span>
        <div style="height: 28px; width: 364px; background: #B9B0A6"></div>
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 20px">9.1</span>
      </div>
      <div style="display: grid; grid-template-columns: 110px 480px minmax(0, 1fr); column-gap: 20px; align-items: center; height: 58px">
        <span style="font-size: 16px">小吃饮品</span>
        <div style="height: 28px; width: 356px; background: #B9B0A6"></div>
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 20px">8.9</span>
      </div>
      <div style="display: grid; grid-template-columns: 110px 480px minmax(0, 1fr); column-gap: 20px; align-items: center; height: 58px">
        <span style="font-size: 16px">外卖为主</span>
        <div style="height: 28px; width: 332px; background: #B9B0A6"></div>
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 20px">8.3</span>
      </div>
      <div style="padding-left: 302px; margin-top: 8px; font-size: 13px; color: #1D1B1A">通用券对照组 4.1%</div>
    </div>
  </div>

  <div style="position: absolute; left: 840px; top: 200px; width: 360px; display: flex; flex-direction: column">
    <div style="border-top: 3px solid {{accent}}; padding-top: 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 104px; line-height: 1; font-weight: 900; color: {{accent}}">9.8%</div>
      <div style="font-size: 17px; font-weight: 500">全量唤回率</div>
      <div style="font-size: 14px; line-height: 1.5; color: #6B655E">136 万沉睡会员，通用券 4.1%</div>
    </div>
    <div style="margin-top: 28px; border-top: 1px solid #DCD6CE; padding-top: 18px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 48px; line-height: 1; font-weight: 700">13.4<span style="font-size: 18px; font-weight: 500; margin-left: 6px">万</span></div>
      <div style="font-size: 17px; font-weight: 500">2025 年请回来的会员</div>
      <div style="font-size: 14px; line-height: 1.5; color: #6B655E">180 天未到店，按上次点的菜分 5 组</div>
    </div>
  </div>

  <div style="position: absolute; left: 80px; top: 640px; font-size: 13px; color: #6B655E">先在 2 万人上做 A/B 小测，各 1 万人，再推到全部 136 万沉睡会员</div>
  <div style="position: absolute; left: 80px; right: 80px; bottom: 32px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #6B655E">
    <span>示例人物，姓名和数据均为虚构</span>
    <span>陈立行　<span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 14px; color: #1D1B1A">07</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6B2D55","options":["#6B2D55","#1F5FD1","#D0312D","#1E8A4C"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6B2D55' };
  }
}
</script>
</body>
</html>
